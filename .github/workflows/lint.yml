name: Lint

on:
  push:
    paths:
      - 'jira-briefer.py'
      - '.pylintrc'
      - '.github/workflows/lint.yml'
  pull_request:
    paths:
      - 'jira-briefer.py'
      - '.pylintrc'

jobs:
  pylint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pylint requests python-dotenv prompt_toolkit jdatetime

      - name: Lint with pylint
        run: pylint --rcfile=.pylintrc jira-briefer.py
