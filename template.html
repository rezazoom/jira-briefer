  body { font-family: "Arad", -apple-system, BlinkMacSystemFont, "Segoe UI", "Vazirmatn", Tahoma, sans-serif;
         background: #f4f6f8; color: #1f2933; padding: 24px; line-height: 1.6; }
  .container { max-width: 860px; margin: 0 auto; }
  header { background: linear-gradient(135deg, #1e3a8a, #2563eb); color: #fff;
          border-radius: 12px; padding: 24px 28px; margin-bottom: 20px; }
  header h1 { font-size: 22px; margin-bottom: 4px; }
  header .sub { opacity: .9; font-size: 14px; }
  .summary { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
  .stat { background: #fff; border: 1px solid #e4e7eb; border-radius: 10px;
          padding: 14px 20px; flex: 1; min-width: 120px; text-align: center;
          box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  .stat .num { font-size: 26px; font-weight: 700; color: #2563eb; }
  .stat .lbl { font-size: 13px; color: #6b7280; }
  .acc-item { background: #fff; border: 1px solid #e4e7eb; border-radius: 10px;
              margin-bottom: 10px; overflow: hidden; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  .acc-head { display: flex; align-items: center; gap: 10px; padding: 14px 18px;
              cursor: pointer; user-select: none; background: #fff; flex-wrap: wrap; }
  .acc-head:hover { background: #f8fafc; }
  .acc-arrow { font-size: 12px; color: #9ca3af; transition: transform .2s; }
  .acc-item.open .acc-arrow { transform: rotate(90deg); }
  .key { font-weight: 700; color: #2563eb; }
  .key a, .acc-title a { color: inherit; text-decoration: none; }
  .key a:hover, .acc-title a:hover { text-decoration: underline; }
  .type { font-size: 12px; background: #eef2ff; color: #3730a3; padding: 2px 8px; border-radius: 6px; }
  .title { flex: 1; }
  .prio { font-size: 11px; padding: 2px 8px; border-radius: 6px; color: #fff; }
  .prio-highest { background: #dc2626; }
  .prio-high { background: #f97316; }
  .prio-medium { background: #2563eb; }
  .prio-low { background: #6b7280; }
  .acc-last { flex: 1 1 100%; font-size: 12px; color: #6b7280; padding-top: 6px; }
  .acc-last b { color: #1f2933; }
  .acc-body { display: none; padding: 6px 18px 18px 18px; border-top: 1px solid #f1f5f9; }
  .acc-item.open .acc-body { display: block; }
  .meta { font-size: 13px; color: #374151; margin: 12px 0; }
  .act { display: flex; align-items: baseline; gap: 10px; padding: 6px 0;
        border-bottom: 1px dashed #eef2f7; font-size: 14px; }
  .act:last-child { border-bottom: none; }
  .ts { flex: 0 0 48px; font-size: 12px; color: #9ca3af; text-align: left; }
  .badge { font-size: 11px; padding: 1px 8px; border-radius: 6px; color: #fff; flex: 0 0 auto; }
  .badge-field { background: #7c3aed; }
  .badge-comment { background: #059669; }
  .from { color: #9ca3af; text-decoration: line-through; }
  .to { color: #046c4e; font-weight: 600; }
  .comment-body { color: #374151; flex: 1; }
  .sub-item { background: #f8fafc; border: 1px solid #e4e7eb; border-radius: 8px;
              margin: 10px 0 4px; padding: 12px 14px; }
  .sub-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
              font-weight: 700; margin-bottom: 6px; }
  .sub-badge { font-size: 10px; background: #f59e0b; color: #fff; padding: 2px 7px;
               border-radius: 6px; }
  .sub-meta { font-size: 13px; color: #374151; margin-bottom: 4px; }
  .sub-last { font-size: 12px; color: #6b7280; margin-bottom: 8px; }
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  .toolbar input, .toolbar select, .toolbar button {
    font-family: inherit; font-size: 13px; padding: 8px 10px;
    border: 1px solid #e4e7eb; border-radius: 8px; background: #fff; color: #1f2933;
    box-shadow: 0 1px 2px rgba(0,0,0,.04); outline: none; }
  .toolbar input { flex: 1; min-width: 180px; }
  .toolbar input:focus, .toolbar select:focus { border-color: #2563eb; }
  .toolbar button { cursor: pointer; background: #2563eb; color: #fff;
                    border-color: #2563eb; font-weight: 600; }
  .toolbar button:hover { background: #1e40af; }
  .no-results { text-align: center; color: #9ca3af; padding: 30px 0; display: none; }
  footer { text-align: center; color: #9ca3af; font-size: 12px; margin-top: 20px; }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>📋 Jira Brief — {{__USER__}}</h1>
    <div class="sub">{{__REPORT_DATE__}} &nbsp;⏷&nbsp; {{__SHAMSI_DATE__}} &nbsp;•&nbsp; Daily Scrum Report</div>
  </header>

  <div class="summary">
    <div class="stat"><div class="num">{{__NUM_ISSUES__}}</div><div class="lbl">Issues</div></div>
    <div class="stat"><div class="num">{{__FIELD_CHANGES__}}</div><div class="lbl">Field changes</div></div>
    <div class="stat"><div class="num">{{__COMMENTS__}}</div><div class="lbl">Comments</div></div>
  </div>

  <div class="toolbar">
    <input id="filter-text" type="search" placeholder="🔍 Search tasks…">
    <select id="filter-prio"><option value="">All priorities</option></select>
    <select id="filter-type"><option value="">All types</option></select>
    <select id="filter-assignee"><option value="">All assignees</option></select>
    <select id="sort-field">
      <option value="priority" selected>Sort: Priority</option>
      <option value="title">Sort: Task name</option>
      <option value="key">Sort: Key</option>
      <option value="status">Sort: Status</option>
      <option value="assignee">Sort: Assignee</option>
      <option value="last">Sort: Last action</option>
    </select>
    <button id="sort-dir" data-dir="desc">↓ Desc</button>
  </div>

  <div id="items-container">
    {{__ITEMS__}}
  </div>

  <div id="no-results" class="no-results">No tasks match your filters.</div>

  <footer>Generated by jira-briefer · {{__GEN_AT__}}</footer>
</div>

<script>
  // ── Accordion behaviour ──────────────────────────────────────────────
  function openItem(item, collapseOthers) {
    if (collapseOthers) {
      document.querySelectorAll('.acc-item.open').forEach(i => i.classList.remove('open'));
    }
    item.classList.add('open');
  }

  document.querySelectorAll('.acc-head').forEach(head => {
    head.addEventListener('click', () => {
      const item = head.closest('.acc-item');
      const wasOpen = item.classList.contains('open');
      document.querySelectorAll('.acc-item.open').forEach(i => i.classList.remove('open'));
      if (!wasOpen) item.classList.add('open');
    });
  });

  // ── Build dropdown options from the data ─────────────────────────────
  const container = document.getElementById('items-container');
  const items = () => Array.from(document.querySelectorAll('.acc-item'));

  function fillOptions(selectId, getValue, label) {
    const select = document.getElementById(selectId);
    const values = [];
    items().forEach(it => {
      const v = getValue(it);
      if (v && !values.includes(v)) values.push(v);
    });
    values.sort();
    values.forEach(v => {
      const opt = document.createElement('option');
      opt.value = v;
      opt.textContent = (label ? label.replace('{v}', v) : v);
      select.appendChild(opt);
    });
  }

  fillOptions('filter-prio', it => it.dataset.prioName, '');
  fillOptions('filter-type', it => it.dataset.type, '');
  fillOptions('filter-assignee', it => it.dataset.assignee, '');

  // ── Sort ─────────────────────────────────────────────────────────────
  const prioRank = { 'Highest': 5, 'High': 4, 'Medium': 3, 'Low': 2, 'Lowest': 1 };

  function sortValue(it, field) {
    switch (field) {
      case 'key': return it.dataset.key;
      case 'priority': return prioRank[it.dataset.prioName] ?? Number(it.dataset.priority) ?? 0;
      case 'status': return it.dataset.status;
      case 'assignee': return it.dataset.assignee;
      case 'last': return it.dataset.lastTs || '';
      default: return it.dataset.title;
    }
  }

  function applySort() {
    const field = document.getElementById('sort-field').value;
    const dir = document.getElementById('sort-dir').dataset.dir;
    const visible = items().filter(it => it.style.display !== 'none');
    visible.sort((a, b) => {
      let r;
      if (field === 'priority' || field === 'last') {
        r = Number(sortValue(a, field)) - Number(sortValue(b, field));
      } else {
        r = String(sortValue(a, field)).localeCompare(String(sortValue(b, field)));
      }
      return dir === 'asc' ? r : -r;
    });
    visible.forEach(it => container.appendChild(it));
  }

  // ── Filter ───────────────────────────────────────────────────────────
  function applyFilter() {
    const text = document.getElementById('filter-text').value.trim().toLowerCase();
    const prio = document.getElementById('filter-prio').value;
    const type = document.getElementById('filter-type').value;
    const assignee = document.getElementById('filter-assignee').value;

    let shown = 0;
    items().forEach(it => {
      const ok =
        (!text || (it.dataset.search || '').includes(text)) &&
        (!prio || it.dataset.prioName === prio) &&
        (!type || it.dataset.type === type) &&
        (!assignee || it.dataset.assignee === assignee);
      it.style.display = ok ? '' : 'none';
      if (ok) shown++;
    });

    document.getElementById('no-results').style.display = shown ? 'none' : 'block';

    // Keep the first visible item open.
    const firstVisible = items().find(it => it.style.display !== 'none');
    document.querySelectorAll('.acc-item.open').forEach(i => i.classList.remove('open'));
    if (firstVisible) firstVisible.classList.add('open');
  }

  function apply() {
    applySort();
    applyFilter();
  }

  document.getElementById('filter-text').addEventListener('input', applyFilter);
  document.getElementById('filter-prio').addEventListener('change', apply);
  document.getElementById('filter-type').addEventListener('change', apply);
  document.getElementById('filter-assignee').addEventListener('change', apply);
  document.getElementById('sort-field').addEventListener('change', applySort);
  document.getElementById('sort-dir').addEventListener('click', () => {
    const btn = document.getElementById('sort-dir');
    const asc = btn.dataset.dir === 'asc';
    btn.dataset.dir = asc ? 'desc' : 'asc';
    btn.textContent = asc ? '↓ Desc' : '↑ Asc';
    applySort();
  });

  // Open the first item by default
  const first = document.querySelector('.acc-item');
  if (first) first.classList.add('open');
</script>
</body>
</html>
